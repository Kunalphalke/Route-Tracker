<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RouteFlow | India route intelligence</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body><main><aside class="panel"><header><div><span class="eyebrow">ROUTE INTELLIGENCE</span><h1>RouteFlow</h1></div><button id="theme" class="icon" title="Toggle dark mode">◐</button></header><p id="status" class="status">Loading India’s road network…</p><section><label>Starting city</label><div class="input-wrap"><input id="source" autocomplete="off" placeholder="Search a city"></div><button id="swap" class="swap" title="Swap cities">⇅</button><label>Destination city</label><div class="input-wrap"><input id="destination" autocomplete="off" placeholder="Search a city"></div></section><section class="grid"><label>Routing mode<select id="mode"><option value="fastest">Fastest</option><option value="distance">Shortest distance</option><option value="fuel">Lowest fuel cost</option><option value="toll">Lowest toll</option></select></label><label>Algorithm<select id="algorithm"><option value="dijkstra">Dijkstra</option><option value="astar">A*</option><option value="bfs">BFS</option><option value="dfs">DFS</option><option value="bellman">Bellman-Ford</option></select></label><label>Weather<select id="weather"><option value="clear">Clear</option><option value="rain">Rain</option><option value="fog">Fog</option><option value="storm">Storm</option></select></label><label>Mileage (km/L)<input id="mileage" type="number" value="15" min="1"></label><label>Fuel price (₹/L)<input id="fuel-price" type="number" value="105" min="1"></label></section><section><div class="slider-title"><span>Traffic intensity <small id="traffic-label">Normal flow</small></span><b id="traffic-value">35%</b></div><input id="traffic" type="range" min="0" max="100" value="35"></section><div class="actions"><button id="find-route" class="primary">Plan route <span>→</span></button><button id="closure" class="secondary">Simulate closure</button></div><section class="result"><span class="eyebrow">JOURNEY SUMMARY</span><div class="metrics"><div><b id="eta">—</b><small>Estimated time</small></div><div><b id="distance">—</b><small>Distance</small></div><div><b id="fuel">—</b><small>Fuel cost</small></div><div><b id="toll">—</b><small>Tolls</small></div></div><p id="path">Choose two cities to start.</p></section><section><span class="eyebrow">RECENT SEARCHES</span><div id="history" class="history"></div></section></aside><section class="map-panel"><div id="map"></div><div class="map-top"><span class="live">● Network online</span><span id="roads">— roads</span></div><article class="stats"><span class="eyebrow">ALGORITHM STATISTICS</span><div id="statistics" class="statistics"><div>Calculating…</div></div></article></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module" src="app.js"></script></body></html>
